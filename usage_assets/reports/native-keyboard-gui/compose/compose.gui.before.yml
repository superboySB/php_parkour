services:
  php:
    environment:
      DISPLAY: ${DISPLAY:?Set DISPLAY to the existing X11 session}
      XAUTHORITY: /tmp/php.xauthority
      MUJOCO_GL: glfw
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:?Set XAUTHORITY to the existing X11 cookie file}:/tmp/php.xauthority:ro
